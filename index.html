<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบคัดกรองสิทธิ์ (Access Control)</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- LINE LIFF SDK -->
  <script charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: 'Kanit', sans-serif;
    }

    .bg-animated {
      background: linear-gradient(
        -45deg,
        #ee7752,
        #e73c7e,
        #23a6d5,
        #23d5ab
      );
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .pulse-loader {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: white;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0);
        opacity: 1;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-animated flex items-center justify-center p-4">

  <!-- ============================= -->
  <!-- Loading -->
  <!-- ============================= -->

  <div id="loadingUI" class="text-center w-full max-w-sm">

    <div class="pulse-loader mx-auto mb-6 shadow-xl"></div>

    <h2 class="text-white text-2xl font-bold mb-2">
      กำลังตรวจสอบสิทธิ์
    </h2>

    <p class="text-white/80">
      กรุณารอสักครู่
    </p>

  </div>


  <!-- ============================= -->
  <!-- ไม่ได้รับอนุญาต -->
  <!-- ============================= -->

  <div id="deniedUI"
    class="hidden bg-white/95 backdrop-blur-lg
           w-full max-w-sm rounded-3xl shadow-2xl
           p-8 text-center
           transform transition-all duration-500
           scale-95 opacity-0">

    <div class="text-7xl mb-4">
      😥
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-2">
      ไม่มีสิทธิ์เข้าถึง
    </h2>

    <p class="text-gray-600 mb-6">
      คุณยังไม่ได้รับอนุญาตให้เข้าระบบ
      <br>
      <span class="font-semibold text-red-500">
        กรุณาติดต่อเจ้าหน้าที่
      </span>
      เพื่อขออนุมัติ
    </p>

    <button
      onclick="closeWindow()"
      class="w-full bg-gray-800 text-white
             font-bold py-3 px-4 rounded-xl
             hover:bg-gray-700 transition-colors">

      ปิดหน้าต่างนี้

    </button>

  </div>


<script>

  /*
   * ==========================================
   * ตั้งค่าระบบ
   * ==========================================
   */

  const MY_LIFF_ID = "2011847486-K9rfnaLX";

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbz86PCNEVyHpDPwirvsh3WXQ_MVy6mHKvw5loOq9wVHVLyfJhmMUemU3_NzgMBkohAPIg/exec";

  const BACKEND_URL =
    "https://sites.google.com/view/nuclearmedicine-referral/home";


  let userProfile = null;


  /*
   * ==========================================
   * เริ่มต้นระบบ
   * ==========================================
   */

  window.onload = function () {

    initializeLiff(MY_LIFF_ID);

  };


  /*
   * ==========================================
   * เริ่ม LIFF
   * ==========================================
   */

  async function initializeLiff(myLiffId) {

    try {

      await liff.init({
        liffId: myLiffId
      });


      /*
       * ถ้ายังไม่ได้ Login
       * ให้ LINE Login ก่อน
       */

      if (!liff.isLoggedIn()) {

        liff.login();

        return;

      }


      /*
       * ดึงข้อมูลผู้ใช้จาก LINE
       */

      userProfile = await liff.getProfile();


      /*
       * ส่ง UID ไปตรวจสอบกับ GAS
       */

      await checkAccess();

    }

    catch (err) {

      console.error(err);

      showError(
        "เกิดข้อผิดพลาด: " +
        (err.message || err)
      );

    }

  }


  /*
   * ==========================================
   * ตรวจสอบสิทธิ์
   * ==========================================
   */

  async function checkAccess() {

    try {

      /*
       * ใช้ text/plain
       * เพื่อป้องกัน CORS preflight
       */

      const res = await fetch(GAS_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          lineName:
            userProfile.displayName,

          lineUid:
            userProfile.userId

        })

      });


      const response = await res.json();


      console.log(
        "GAS response:",
        response
      );


      handleServerResponse(response);

    }

    catch (err) {

      console.error(err);

      showError(
        "ไม่สามารถตรวจสอบสิทธิ์ได้\n" +
        (err.message || err)
      );

    }

  }


  /*
   * ==========================================
   * ประมวลผลผลจาก GAS
   * ==========================================
   */

  function handleServerResponse(response) {

    hideUI("loadingUI");


    /*
     * ======================================
     * 1. ได้รับอนุญาตแล้ว
     * ======================================
     *
     * Allow = TRUE
     *
     * ให้เข้าเว็บหลังบ้านทันที
     */

    if (response.status === "allowed") {

      window.location.replace(
        BACKEND_URL
      );

      return;

    }


    /*
     * ======================================
     * 2. มี UID แล้ว แต่ยังไม่อนุมัติ
     * ======================================
     *
     * Allow = FALSE
     *
     * ห้ามเข้าเว็บหลังบ้าน
     */

    if (response.status === "pending") {

      showUI("deniedUI");

      return;

    }


    /*
     * ======================================
     * 3. ยังไม่เคยมี UID
     * ======================================
     *
     * ระบบจะบันทึก UID
     * และส่งข้อความขอสิทธิ์
     */

    if (response.status === "new_request") {

      sendUIDToChat(
        userProfile.userId
      );

      showUI("deniedUI");

      return;

    }


    /*
     * ======================================
     * 4. Error
     * ======================================
     */

    alert(
      "เกิดข้อผิดพลาด: " +
      (response.message || "ไม่ทราบสาเหตุ")
    );

  }


  /*
   * ==========================================
   * ส่ง UID ไปยังแชต LINE
   * ==========================================
   */

  function sendUIDToChat(uid) {

    if (liff.isInClient()) {

      liff.sendMessages([{

        type: "text",

        text:
          "ผมขอสิทธิ์เข้าระบบหลังบ้านครับ\n" +
          "UID ของผมคือ: " +
          uid

      }])

      .catch(function (err) {

        console.log(
          "sendMessages error:",
          err
        );

      });

    }

  }


  /*
   * ==========================================
   * ปิดหน้าต่าง LIFF
   * ==========================================
   */

  function closeWindow() {

    if (liff.isInClient()) {

      liff.closeWindow();

    }

  }


  /*
   * ==========================================
   * แสดง Error
   * ==========================================
   */

  function showError(msg) {

    hideUI("loadingUI");

    alert(msg);

  }


  /*
   * ==========================================
   * ซ่อน UI
   * ==========================================
   */

  function hideUI(id) {

    const el =
      document.getElementById(id);

    if (el) {

      el.classList.add("hidden");

    }

  }


  /*
   * ==========================================
   * แสดง UI
   * ==========================================
   */

  function showUI(id) {

    const el =
      document.getElementById(id);

    if (!el) return;


    el.classList.remove("hidden");


    setTimeout(function () {

      el.classList.remove(
        "scale-95",
        "opacity-0"
      );

      el.classList.add(
        "scale-100",
        "opacity-100"
      );

    }, 50);

  }

</script>

</body>
</html>
```
